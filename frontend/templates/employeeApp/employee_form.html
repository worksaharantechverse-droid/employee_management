{% extends 'employeeApp/base.html' %}
{% block title %}
    {{ title }}
{% endblock %}
{% block content %}
    <style>
        .form-card {
            max-width:850px;
            margin:auto;
        }
        .form-grid {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:16px;
        }
        .field {
            display:flex;
            flex-direction:column;
            gap:6px;
        }
        .field.full {
            grid-column:1/-1;
        }
        .field label {
            font-weight:600;
        }
        .field input,.field select,.field textarea {
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }
        .field ul.errorlist {
            color:#c62828;
            list-style:none;
            font-size:13px;
        }
        @media(max-width:700px) {
            .form-grid {
                grid-template-columns:1fr;
            }
            .field.full {
                grid-column:auto;
            }
        }
    </style>
    <div class="card form-card">
        <h2 style="margin-bottom:20px">
            {{ title }}
        </h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-grid">
                {% for field in form %}
                    <div class="field {% if field.name == 'address' %}full{% endif %}">
                        <label for="{{ field.id_for_label }}">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {{ field.errors }}
                    </div>
                {% endfor %}
            </div>
            <div style="margin-top:22px">
                <button class="btn primary" type="submit">
                    Save Employee
                </button>
                <a class="btn secondary" href="{% url 'employee_list' %}">
                    Cancel
                </a>
            </div>
        </form>
    </div>
{% endblock %}

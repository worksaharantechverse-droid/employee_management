{% extends 'employeeApp/base.html' %}
{% block content %}
    <div class="card" style="max-width:650px;margin:auto">
        <h2>
            Add Employee to
            {{ team.name }}
        </h2>
        <form method="post" style="margin-top:20px">
            {% csrf_token %}
            <label>
                Select Employee
            </label>
            <select name="employee_id" required style="width:100%;padding:11px;margin:8px 0 18px;border:1px solid #ccc;border-radius:5px">
                <option value="">
                    Select employee
                </option>
                {% for employee in employees %}
                    <option value="{{ employee.id }}">
                        {{ employee.name }}
                        —
                        {{ employee.email }}
                    </option>
                    {% empty %}
                    <option value="">
                        No available employees
                    </option>
                {% endfor %}
            </select>
            <button class="btn primary" type="submit">
                Add to Team
            </button>
            <a href="{% url 'manager_team' %}" class="btn secondary">
                Cancel
            </a>
        </form>
    </div>
{% endblock %}
